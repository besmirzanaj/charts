{{- if .Values.keydb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "validate-email.fullname" . }}-keydb
  labels:
    {{- include "validate-email.labels" . | nindent 4 }}
    app.kubernetes.io/component: keydb
spec:
  clusterIP: None
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: keydb
  selector:
    {{- include "validate-email.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: keydb
{{- end }}
