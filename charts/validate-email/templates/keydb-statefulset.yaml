{{- if .Values.keydb.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "validate-email.fullname" . }}-keydb
  labels:
    {{- include "validate-email.labels" . | nindent 4 }}
    app.kubernetes.io/component: keydb
spec:
  serviceName: {{ include "validate-email.fullname" . }}-keydb
  replicas: {{ .Values.keydb.replicas }}
  selector:
    matchLabels:
      {{- include "validate-email.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: keydb
  template:
    metadata:
      labels:
        {{- include "validate-email.labels" . | nindent 8 }}
        app.kubernetes.io/component: keydb
    spec:
      containers:
        - name: keydb
          image: "{{ .Values.keydb.image.repository }}:{{ .Values.keydb.image.tag }}"
          imagePullPolicy: {{ .Values.keydb.image.pullPolicy }}
          ports:
            - containerPort: 6379
              name: keydb
          command:
            - keydb-server
            - --active-replica
            - "yes"
            - --multi-master
            - "yes"
            - --save
            - ""
            - --appendonly
            - "no"
            {{- $fullname := include "validate-email.fullname" . }}
            {{- $replicas := int .Values.keydb.replicas }}
            {{- range $i := until $replicas }}
            - --replicaof
            - {{ $fullname }}-keydb-{{ $i }}.{{ $fullname }}-keydb
            - "6379"
            {{- end }}
          resources:
            {{- toYaml .Values.keydb.resources | nindent 12 }}
          {{- with .Values.keydb.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.keydb.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
