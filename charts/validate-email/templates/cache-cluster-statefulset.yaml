{{- if and .Values.cache.enabled (eq .Values.cache.mode "cluster") }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "validate-email.fullname" . }}-cache
  labels:
    {{- include "validate-email.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  serviceName: {{ include "validate-email.fullname" . }}-cache
  replicas: {{ .Values.cache.cluster.nodes }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "validate-email.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        {{- include "validate-email.labels" . | nindent 8 }}
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: valkey
          image: "{{ .Values.cache.image.repository }}:{{ .Values.cache.image.tag }}"
          imagePullPolicy: {{ .Values.cache.image.pullPolicy }}
          ports:
            - containerPort: 6379
              name: valkey
            - containerPort: 16379
              name: cluster-bus
          command: ["/bin/sh", "-c"]
          args:
            - |
              POD_IP=$(hostname -i)
              exec valkey-server \
                --cluster-enabled yes \
                --cluster-config-file /data/nodes.conf \
                --cluster-node-timeout {{ .Values.cache.cluster.nodeTimeout }} \
                --save "" \
                --appendonly no \
                --maxmemory {{ .Values.cache.maxmemory }} \
                --maxmemory-policy {{ .Values.cache.maxmemoryPolicy }} \
                --cluster-announce-ip "$POD_IP" \
                --cluster-announce-port 6379 \
                --cluster-announce-bus-port 16379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.cache.resources | nindent 12 }}
          {{- with .Values.cache.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.cache.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
