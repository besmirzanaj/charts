{{- if and .Values.cache.enabled (eq .Values.cache.mode "cluster") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "validate-email.fullname" . }}-cache-init
  labels:
    {{- include "validate-email.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache-init
  annotations:
    # Run after the StatefulSet is created
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "validate-email.labels" . | nindent 8 }}
        app.kubernetes.io/component: cache-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: cluster-init
          image: "{{ .Values.cache.image.repository }}:{{ .Values.cache.image.tag }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e

              NODES={{ .Values.cache.cluster.nodes }}
              REPLICAS={{ .Values.cache.cluster.replicas }}
              SERVICE="{{ include "validate-email.fullname" . }}-cache"

              echo "Waiting for all $NODES cluster nodes to be ready..."
              for i in $(seq 0 $((NODES - 1))); do
                HOST="${SERVICE}-${i}.${SERVICE}"
                until valkey-cli -h "$HOST" -p 6379 ping 2>/dev/null | grep -q PONG; do
                  echo "  waiting for $HOST ..."
                  sleep 2
                done
                echo "  $HOST is ready"
              done

              # Check if cluster is already formed
              CLUSTER_INFO=$(valkey-cli -h "${SERVICE}-0.${SERVICE}" -p 6379 cluster info 2>/dev/null || true)
              if echo "$CLUSTER_INFO" | grep -q "cluster_state:ok"; then
                echo "Cluster already formed, skipping init"
                exit 0
              fi

              # Build the node list for --cluster create
              NODE_LIST=""
              for i in $(seq 0 $((NODES - 1))); do
                HOST="${SERVICE}-${i}.${SERVICE}"
                # Resolve the pod IP (cluster create needs IP:port)
                IP=$(getent hosts "$HOST" | awk '{print $1}')
                if [ -z "$IP" ]; then
                  echo "ERROR: could not resolve $HOST"
                  exit 1
                fi
                NODE_LIST="$NODE_LIST $IP:6379"
              done

              echo "Creating cluster with: $NODE_LIST"
              echo "  replicas per master: $REPLICAS"
              valkey-cli --cluster create $NODE_LIST \
                --cluster-replicas "$REPLICAS" \
                --cluster-yes

              echo "Cluster creation complete"
              valkey-cli -h "${SERVICE}-0.${SERVICE}" -p 6379 cluster info
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
