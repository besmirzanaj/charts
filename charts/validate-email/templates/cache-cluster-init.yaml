{{- if and .Values.cache.enabled (eq .Values.cache.mode "cluster") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "validate-email.fullname" . }}-cache-init
  labels:
    {{- include "validate-email.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache-init
  annotations:
    # A Sync hook after the StatefulSet (wave 0), not PostSync: PostSync only
    # runs after a fully healthy sync, so one degraded first sync left the
    # cluster unformed. The reconcile is idempotent, so every sync may run it.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Plain Helm installs (ArgoCD ignores these when its own hook is set).
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "validate-email.labels" . | nindent 8 }}
        app.kubernetes.io/component: cache-init
    spec:
      {{- include "validate-email.cacheClusterReconcilePod" . | nindent 6 }}
---
# Self-healing: re-forms the cluster after pod restarts (e.g. a node reboot),
# which the one-shot Job above cannot see.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "validate-email.fullname" . }}-cache-reconcile
  labels:
    {{- include "validate-email.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache-reconcile
spec:
  schedule: {{ .Values.cache.cluster.reconcileSchedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            {{- include "validate-email.labels" . | nindent 12 }}
            app.kubernetes.io/component: cache-reconcile
        spec:
          {{- include "validate-email.cacheClusterReconcilePod" . | nindent 10 }}
{{- end }}
