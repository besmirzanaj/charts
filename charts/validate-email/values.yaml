replicaCount: 2

image:
  repository: registry.gitlab.com/besmirzanaj/validate-email
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

imagePullSecrets: []

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 9001

ingress:
  enabled: false
  className: ""
  annotations: {}
    # nginx rate-limiting (recommended for HA to protect SMTP probing):
    # nginx.ingress.kubernetes.io/limit-rps: "10"
    # nginx.ingress.kubernetes.io/limit-connections: "5"
    # nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

nodeSelector: {}

tolerations: []

affinity: {}

# -- Comma-separated list of API keys. If empty, a random key is auto-generated.
apiKeys: ""

# -- SMTP sender address used in the RCPT TO probe
smtpSender: "test@example.com"

# -- SMTP connection timeout in seconds
smtpTimeout: 10

# -- Waitress WSGI thread pool size (each SMTP probe blocks up to smtpTimeout seconds)
waitressThreads: 16

# -- Cache TTL in seconds for validated email results
cacheTTL: 300

# -- Valkey cache for shared validation result deduplication across pods.
# --
# -- mode: "single"     — 1 Valkey pod, emptyDir, no persistence (default)
# -- mode: "replicated" — 1 master + 1 replica, emptyDir, automatic failover
# --                       during rolling restarts (replica holds data while master restarts)
# --
# -- Set enabled: false to disable the cache entirely (app falls back to no-cache).
cache:
  enabled: true
  # -- "single" or "replicated"
  mode: single
  image:
    repository: valkey/valkey
    tag: 8-alpine
    pullPolicy: IfNotPresent
  # -- Valkey maxmemory (should fit within resource limits)
  maxmemory: 48mb
  # -- Eviction policy when maxmemory is reached
  maxmemoryPolicy: allkeys-lru
  resources:
    limits:
      cpu: 100m
      memory: 64Mi
    requests:
      cpu: 50m
      memory: 32Mi
  livenessProbe:
    exec:
      command: ["valkey-cli", "ping"]
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    exec:
      command: ["valkey-cli", "ping"]
    initialDelaySeconds: 3
    periodSeconds: 5

# -- Use an existing secret instead of creating one. The secret must contain a key named "api_keys".
existingSecret: ""

# -- Prometheus PodMonitor (requires prometheus-operator / kube-prometheus-stack)
podMonitor:
  enabled: false
  # -- Scrape interval
  interval: 30s
  # -- Additional labels for the PodMonitor (e.g. to match a Prometheus instance)
  additionalLabels: {}
